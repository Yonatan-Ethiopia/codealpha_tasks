<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Shorten a link.</h1>
        <form id="url-form">
            <input type="url" id="long-url" placeholder="https://example.com/very/long/path" required>
            <button type="submit">Shorten</button>
        </form>
        <div id="result">
            <p>Your short link:</p>
            <a id="short-link" href="" target="_blank"></a>
        </div>
    </div>

    <script>
        document.getElementById('url-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const longUrl = document.getElementById('long-url').value;
            const resultDiv = document.getElementById('result');
            const shortLinkAnchor = document.getElementById('short-link');
            const btn = e.target.querySelector('button');
            
            btn.textContent = 'Shortening...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ long_url: longUrl })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    shortLinkAnchor.href = data.short_url;
                    shortLinkAnchor.textContent = data.short_url;
                    resultDiv.style.display = 'block';
                } else {
                    alert('Error shortening URL');
                }
            } catch (error) {
                console.error(error);
                alert('Network error');
            } finally {
                btn.textContent = 'Shorten';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
